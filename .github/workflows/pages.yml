# Copy to .github/workflows/pages.yml of the instance repository.
name: Pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "status.config.json"
      - ".github/workflows/_pages.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  pages:
    uses: ./.github/workflows/_pages.yml
